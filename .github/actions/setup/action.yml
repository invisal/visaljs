# What nearly every job does after its checkout: Node (.nvmrc's, unless node-version says
# otherwise), with npm's cache, and the workspace's packages installed.
name: Set up
description: Node with npm's cache, and npm ci
inputs:
  node-version:
    description: a Node version; .nvmrc's when empty
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: npm
    - run: npm ci
      shell: bash
