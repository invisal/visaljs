# Nightly, on main: what is too slow to run on every pull request commit (ci.yml): the program
# tests under GC stress, every app (the full tier of tests/apps/check.ts), and the benchmarks
# (servers, kernels, GC). Skipped when main has no
# commit since the last night; run it by hand from the Actions tab (workflow_dispatch) to check a
# branch.
#
# The benchmarks run on our own runner (label `bench`: a 4-core VM kept for them), one
# job at a time, so their timings compare from night to night; the other jobs run on GitHub's
# runners. The runner is self-hosted on a public repository: it only takes jobs of this
# workflow, which runs on main, or by hand (workflow_dispatch) for those who can write to the
# repository. A pull request's workflows must never use it.
#
# The numbers are published to the gh-pages branch (the publish job): a job uploads an artifact
# named `<name>-json` holding its JSON files, and they appear at https://invisal.github.io/visaljs/.
name: Nightly

on:
  schedule:
    - cron: "0 19 * * *"  # 19:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit on main since the last night: nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

  bench:
    # The server benchmarks (bench/servers.ts): http-hello, Express, Hono, Next.js and vinext as
    # visaljs's binary against Node and Bun (their single executable and compiled binary; Next.js's
    # and vinext's production servers, which have none), measured one after another. Fails when
    # visaljs serves under 0.8× Node's requests per second on an Express route (it serves about
    # 1.3×; the margin is the shared runner's noise), has errors there, or fails to build or serve
    # an app; the other apps' speeds are for reading (on Hono, about Node's, a gate would fail at
    # random). Every app is measured before the check, and the numbers are kept either way: the
    # tables go to the job summary, servers.json to gh-pages (the publish job), the website's.
    # Locally: npm run bench:servers
    name: Server benchmarks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, bench]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
      - name: wrk
        run: command -v wrk || sudo -n apt-get install -y wrk
      - run: npm run apps:install -- http-hello express hono nextjs vinext
      - name: Benchmark
        run: |
          set -o pipefail
          npm run --silent bench:servers -- --min-ratio=0.8 --gate=express --json=servers.json | tee bench.md
      - name: Summary
        if: always()
        run: if [ -f bench.md ]; then cat bench.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: servers-json
          path: servers.json
          if-no-files-found: ignore

  kernels:
    # The compute kernels (bench/kernels.ts): ours, Are We Fast Yet and the Benchmarks Game, each
    # built by visaljs and timed against Node. Fails when a build fails or a kernel's output
    # differs from Node's, except for kernels marked unsupported; the times are for reading (job
    # summary, kernels.json on gh-pages), not a gate. Locally: npm run bench:kernels
    name: Kernel benchmarks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, bench]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Benchmark
        run: |
          set -o pipefail
          npm run --silent bench:kernels -- --json=kernels.json | tee kernels.md
      - name: Summary
        if: always()
        run: if [ -f kernels.md ]; then cat kernels.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernels-json
          path: kernels.json
          if-no-files-found: ignore

  gc-bench:
    # The GC benchmarks (bench/gc.ts): each built by visaljs and run against
    # Node, with what the collector reports (JS_GC_STATS); the scaling benchmarks
    # (bench/gc-scaling.ts): pauses as the live heap and the runtime's tables grow; then the server
    # benchmark (bench/gc-server.ts): latency and memory under load and idle. Fails when a build
    # fails, an output differs from Node's or a request fails; the numbers are for reading (job
    # summary), and published to gh-pages, to compare nights.
    # Locally: npm run bench:gc, npm run bench:gc-scaling, npm run bench:gc-server (needs wrk)
    name: GC benchmarks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, bench]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: wrk
        run: command -v wrk || sudo -n apt-get install -y wrk
      - name: Benchmark
        run: |
          set -o pipefail
          npm run --silent bench:gc -- --json=gc.json | tee gc.md
          echo >> gc.md
          npm run --silent bench:gc-scaling -- --json=gc-scaling.json | tee -a gc.md
          echo >> gc.md
          npm run --silent bench:gc-server -- --json=gc-server.json | tee -a gc.md
      - name: Summary
        if: always()
        run: if [ -f gc.md ]; then cat gc.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-json
          path: |
            gc.json
            gc-scaling.json
            gc-server.json
          if-no-files-found: ignore

  publish:
    # Every artifact named `*-json` onto the gh-pages branch, which GitHub Pages serves at
    # https://invisal.github.io/visaljs/: its files at the branch's root (servers.json, gc.json, …),
    # each night's replacing the last, so the branch's log is the numbers' history. Only from main
    # (a run by hand on another branch publishes nothing); a job that failed uploads nothing, and its
    # files keep the last night's numbers. Creates the branch when it's missing.
    name: Publish the numbers
    needs: [changes, bench, kernels, gc-bench]
    if: always() && needs.changes.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true  # every job failed: nothing to publish
        with:
          pattern: "*-json"
          path: data
          merge-multiple: true
      - name: Commit to gh-pages
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No numbers to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git init -q pages && cd pages
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          if git fetch -q --depth=1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          touch .nojekyll  # plain files: no Jekyll build
          cp "${files[@]/#/../}" .
          git add -A
          if git diff --cached --quiet; then
            echo "The numbers are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Nightly numbers: main at ${SHA:0:7}"
          git push -q origin gh-pages
          echo "Published: $(cd ../data && ls *.json | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  gc-checks:
    # The program tests against a checking runtime (programs.yml's gc-stress), in shards. The
    # runtime's own tests run under stress on every pull request (ci.yml).
    name: Programs under GC stress
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/programs.yml
    with:
      shards: "[1, 2, 3]"
      gc-stress: true

  apps:
    # Every app compiled and checked against Node (tests/apps/check.ts --tier=full), express-postgres
    # and mysql against their databases: service containers, as their compose.yaml. The fast tier
    # runs on every pull request (ci.yml, the cross-platform check).
    # Locally: node tests/apps/check.ts --tier=full
    name: Apps, full tier
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node tests/apps/check.ts --tier=full --require-databases
        env:
          VISALJS_POSTGRES_URL: postgres://app:app@localhost:5432/app
          VISALJS_MYSQL_URL: mysql://app:app@127.0.0.1:3306/app
