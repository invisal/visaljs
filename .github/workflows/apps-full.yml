# The full tier of the apps (tests/apps/check.ts): every app compiled and checked against Node,
# express-postgres and mysql against their databases (service containers, as their compose.yaml).
# Linux only. Called by ci.yml (a pull request that changes tests/apps) and nightly.yml; run it by
# hand from the Actions tab to check a branch. Locally: node tests/apps/check.ts --tier=full
name: Apps, full tier

on:
  workflow_call:
  workflow_dispatch:

jobs:
  apps:
    name: Every app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node tests/apps/check.ts --tier=full --require-databases
        env:
          VISALJS_POSTGRES_URL: postgres://app:app@localhost:5432/app
          VISALJS_MYSQL_URL: mysql://app:app@127.0.0.1:3306/app
